apriltag_camera_detector:
  ros__parameters:
    input_source: device

    # For input_source:=device
    video_device: /dev/video0
    device_width: 640
    device_height: 480
    device_fps: 30.0
    detect_rate_hz: 20.0
    capture_buffer_size: 1
    # OpenCV pose output is in the optical frame, not camera_link/body frame.
    camera_frame_id: camera_optical_frame

    # Optional manual intrinsics for device mode. If fx/fy/cx/cy stay 0,
    # node uses an approximate camera model from hfov_deg and frame size.
    fx: 824.098969
    fy: 822.930714
    cx: 308.724037
    cy: 224.611413
    calibration_width: 640
    calibration_height: 480
    hfov_deg: 78.0
    dist_coeffs: [0.346669, -1.162089, -0.004623, -0.002351, 0.0]

    # For input_source:=ros_topics
    image_topic: /image_raw
    camera_info_topic: /camera_info

    # Keep image transport off in flight unless explicitly enabled for a bench test.
    image_output_topic: /image_raw
    camera_info_output_topic: /camera_info
    publish_image_stream: false

    tag_pose_topic: /precision_landing/tag_pose_camera
    dictionary: 36h11
    # Measured black-square tag side length.
    tag_size_m: 0.115
    target_tag_id: 0
    min_tag_area_px: 500.0

apriltag_precision_landing:
  ros__parameters:
    input_mode: camera_pose
    tf_topic: /tf
    camera_tag_pose_topic: /precision_landing/tag_pose_camera
    relay_image_stream: false
    image_input_topic: /image_raw
    image_output_topic: /image_raw

    drone_pose_topic: /mavros/local_position/pose
    landing_target_topic: /mavros/landing_target/pose
    world_frame: map
    drone_frame: base_link
    camera_mount_frame: camera_link
    camera_optical_frame: camera_optical_frame
    tag_detection_frame: apriltag_detection
    tag_world_frame: apriltag_world

    tag_frame_prefix: id
    tag_frame_exact: ""

    publish_rate_hz: 20.0
    input_timeout_sec: 0.30

    # Camera optical origin measured from the FC origin; orientation unchanged.
    camera_offset_x: 0.10
    camera_offset_y: 0.0
    camera_offset_z: -0.06
    # This tuned transform is applied directly from drone_frame -> camera_optical_frame.
    camera_roll: 0.0
    camera_pitch: 3.141592653589793
    camera_yaw: 1.5707963267948966
    publish_camera_mount_to_optical_tf: false
    optical_roll: 0.0
    optical_pitch: 0.0
    optical_yaw: 0.0

    publish_world_to_drone_tf: true
    publish_static_camera_tf: true
    publish_camera_tag_tf: true
    publish_debug_tf: true
