spatial_awareness:
  ros__parameters:
    use_sim_time: false
    horizontal_scan_topic: "/scan_slam"
    vertical_scan_topic: "/scan_vertical_disabled"
    vertical_cloud_topic: "/vertical_cloud_disabled"
    odom_topic: "/mavros/local_position/odom"
    horizontal_scan_stamp_reference: "end"
    fixed_frame: "odom"
    base_frame: "base_footprint"

    local_cloud_topic: "/mapping/local_obstacle_cloud"
    marker_topic: "/mapping/spatial_awareness/markers"
    diagnostics_topic: "/mapping/spatial_awareness/status"

    local_radius_m: 5.0
    rolling_window_sec: 0.8
    sensor_stale_timeout_sec: 0.6
    odom_stale_timeout_sec: 0.35
    pending_message_timeout_sec: 0.5
    odom_interpolation_max_gap_sec: 0.12
    odom_nearest_sample_tolerance_sec: 0.06
    input_processing_hz: 50.0
    local_cloud_publish_hz: 10.0
    diagnostics_publish_hz: 2.0
    local_voxel_size_m: 0.05
    min_obstacle_range_m: 0.08
    max_obstacle_range_m: 12.0
    max_pending_messages: 8
    max_messages_per_cycle: 4
    max_observations: 32
    max_points_per_observation: 5000
    max_buffered_points: 80000
    max_local_points: 30000
    marker_lifetime_sec: 0.35

    collision_center_x_m: 0.0
    collision_center_y_m: 0.0
    collision_center_z_offset_m: 0.0
    drone_body_length_m: 0.50
    drone_body_width_m: 0.50
    drone_body_height_m: 0.35
    propeller_tip_to_tip_length_m: 0.75
    propeller_tip_to_tip_width_m: 0.75
    self_filter_padding_m: 0.10

    horizontal_safety_margin_m: 0.40
    vertical_safety_margin_m: 0.30
    horizontal_danger_margin_m: 0.15
    vertical_danger_margin_m: 0.12

    # Until LD19 is installed, only horizontal directions have sensor
    # coverage. Top and bottom intentionally remain UNKNOWN.
    horizontal_sensor_directions: ["front", "rear", "left", "right"]
    vertical_sensor_directions: ["none"]
