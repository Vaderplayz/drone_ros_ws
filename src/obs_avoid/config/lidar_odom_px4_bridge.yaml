lidar_odom_monitor:
  ros__parameters:
    scan_topic: /scan_rf2o
    raw_odom_topic: /lidar/odom_raw
    imu_topic: /mavros/imu/data
    output_odom_topic: /lidar/odom
    diagnostics_topic: /lidar_odom/diagnostics
    expected_parent_frame: lidar_odom
    expected_child_frame: base_footprint
    expected_scan_bins: 720
    min_valid_beam_ratio: 0.05
    min_scan_rate_hz: 1.0
    scan_timeout_sec: 0.75
    odom_timeout_sec: 0.75
    imu_timeout_sec: 0.75
    max_position_jump_m: 0.50
    max_yaw_jump_rad: 0.50
    max_abs_z_m: 0.05
    max_rf2o_roll_pitch_rad: 0.10
    max_vehicle_roll_pitch_rad: 0.35

lidar_odom_px4_bridge:
  ros__parameters:
    lidar_odom_topic: /lidar/odom
    monitor_diagnostics_topic: /lidar_odom/diagnostics
    px4_odom_topic: /mavros/local_position/odom
    mavros_state_topic: /mavros/state
    scan_topic: /scan_rf2o
    output_topic: /mavros/odometry/out
    diagnostics_topic: /lidar_odom_px4_bridge/diagnostics
    expected_lidar_frame: lidar_odom
    output_parent_frame: odom
    output_child_frame: base_link
    publish_rate_hz: 10.0
    odom_timeout_sec: 0.50
    scan_timeout_sec: 0.50
    diagnostic_timeout_sec: 1.0
    px4_odom_timeout_sec: 0.50
    require_disarmed_for_alignment: true
    horizontal_position_stddev_m: 0.30
    yaw_stddev_rad: 0.20
    unused_axis_variance: 1000000.0
    max_roll_pitch_rad: 0.35
    max_position_jump_m: 0.50
    max_yaw_jump_rad: 0.50
